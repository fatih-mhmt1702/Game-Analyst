services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game_analyst_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: "no"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: game_analyst_tunnel
    restart: "no"
    command: tunnel --no-autoupdate --url http://web:8000
    depends_on:
      - web
